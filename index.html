
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBMC Contact Us</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('school.jpg');
            background-size: cover;
            background-position: center;
            font-family: Arial;
        }

        .navbar {
            background-color: #222;
        }

        .content {
            padding: 25px;
        }

        .office-title {
            background-color: white;
            text-align: center;
            padding: 5px;
        }

        .contact-box {
            background-color: white;
            padding: 15px;
            border-radius: 5px;
        }

        .contact-box h3 {
            text-align: center;
        }

        .table {
            background-color: white;
            text-align: center;
            font-size: 13px;
        }

        .table th {
            background-color: #c5dcff;
        }

        .btn {
            width: 100%;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                OBMC | Contact Us
            </a>

            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search">

                <button class="btn btn-primary" type="button"
                onclick="window.location.href='https://www.obmontessori.edu.ph'">
                    Search
                </button>
            </form>

        </div>
    </nav>

    <div class="container content">

        <div class="row">

            <div class="col-md-7">

                <h4 class="office-title">School Office Hours</h4>

                <table class="table table-striped table-bordered">

                    <tr>
                        <th>Day</th>
                        <th>Office Hours</th>
                        <th>Department</th>
                    </tr>

                    <tr>
                        <td>Monday</td>
                        <td>8:00 AM - 4:00 PM</td>
                        <td>Registrar's Office</td>
                    </tr>

                    <tr>
                        <td>Tuesday</td>
                        <td>8:00 AM - 4:00 PM</td>
                        <td>Accounting Office</td>
                    </tr>

                    <tr>
                        <td>Wednesday</td>
                        <td>8:00 AM - 4:00 PM</td>
                        <td>Guidance Office</td>
                    </tr>

                    <tr>
                        <td>Thursday</td>
                        <td>8:00 AM - 4:00 PM</td>
                        <td>Principal's Office</td>
                    </tr>

                    <tr>
                        <td>Friday</td>
                        <td>8:00 AM - 3:00 PM</td>
                        <td>Admin Office</td>
                    </tr>

                </table>

            </div>

            <div class="col-md-4 offset-md-1">

                <div class="contact-box">

                    <h3>Contact Us</h3>

                    <form>

                        <div class="mb-2">
                            <label>Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your full name">
                        </div>

                        <div class="mb-2">
                            <label>Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter your email">
                        </div>

                        <div class="mb-2">
                            <label>Subject</label>
                            <input type="text" class="form-control" placeholder="Enter subject">
                        </div>

                        <div class="mb-2">
                            <label>Message</label>
                            <textarea class="form-control" rows="4" placeholder="Type your message here"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
